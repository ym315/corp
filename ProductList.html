<body>
    <main class="main-common">
        <article class="main-menu"></article>
        <article class="main-content">
            <h2>최신 상품 리스트</h2>
             <section class="product-list-bg">
                <div class="product-list">
                    <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vT3Rna0hOAlSoOXP9EWsCimpju9AGr46Ak6UpwJgIqJAMGRX2EV4VdbzxulDTUiaWzJT-UWnv0JRRjZ/pubhtml?gid=0&amp;single=true&amp;widget=false&amp;chrome=false&amp;headers=true&amp;range=A:C">
                    </iframe> 
                </div>
                <div class="product-down">
                    <a href="https://docs.google.com/spreadsheets/d/1q-Hl8efHtaE4KPWpTHjb0MXwtpBvMvff55rF-kCG07Y/export?format=xlsx">
                        전체 상품 리스트 다운로드
                    </a>
                    </div>
            </section>
        </article>
    </main>

    
  <script src="https://code.jquery.com/jquery-2.2.0.min.js" type="text/javascript"></script>
  <script type="text/javascript">
        $(document).ready(function () {
            // thead 체크박스
            const $checkAll = $(".common-table thead tr td input[type='checkbox']");
            // tbody 체크박스
            const $checkboxes = $(".common-table tbody tr td input[type='checkbox']");

            // 전체선택 / 해제
            $checkAll.on("change", function () {
                $checkboxes.prop("checked", $(this).prop("checked"));
            });
            $checkboxes.on("change", function () {
                if ($checkboxes.length === $checkboxes.filter(":checked").length) {
                    $checkAll.prop("checked", true);
                } else {
                    $checkAll.prop("checked", false);
                }
            });
        });
    </script>
</body>

</html>
